<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Park.in network mark</title>
  <desc id="desc">Four mobility lanes join one live urban capacity loop to form the letter P.</desc>
  <defs>
    <linearGradient id="surface" x1="8" y1="5" x2="57" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13243D"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <linearGradient id="curb" x1="25" y1="14" x2="52" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB923C"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#surface)" stroke="#263A57" filter="url(#shadow)"/>

  <!-- Four stakeholders feed the same operating layer. -->
  <circle cx="15" cy="48" r="2.3" fill="#67E8F9"/>
  <circle cx="21" cy="48" r="2.3" fill="#FB923C"/>
  <circle cx="27" cy="48" r="2.3" fill="#67E8F9"/>
  <circle cx="33" cy="48" r="2.3" fill="#FB923C"/>
  <path d="M15 43v-4c0-3 2-5 5-5h5M21 43v-9M27 43v-9M33 43v-9" fill="none" stroke="#9FB0C8" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>

  <!-- A controlled curb loop resolves the network into a distinctive P. -->
  <path d="M25 43V16h10.5C45.7 16 51 21.1 51 29s-5.3 13-15.5 13H25" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35.5 19C43.2 19 48 22.7 48 29s-4.8 10-12.5 10" fill="none" stroke="url(#curb)" stroke-width="4" stroke-linecap="round"/>

  <!-- Live sensor / available-capacity state. -->
  <circle cx="44.5" cy="21" r="4.1" fill="#22D3EE" stroke="#CFFAFE" stroke-width="1.5"/>
  <path d="M42.6 21l1.3 1.3 2.5-2.8" fill="none" stroke="#07101F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Park.in</title>
  <desc id="desc">A modern letter P that becomes a location pinpoint.</desc>
  <defs>
    <linearGradient id="surface" x1="7" y1="5" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152844"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <linearGradient id="brand" x1="17" y1="10" x2="48" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#surface)" stroke="#2A3E5C" filter="url(#shadow)"/>

  <!-- One continuous P silhouette; its stem finishes as a location point. -->
  <path fill="url(#brand)" fill-rule="evenodd" d="M19 12h17.5C47.4 12 54 18.3 54 28s-6.6 16-17.5 16H29v4.2L23 56l-6-7.8V14a2 2 0 0 1 2-2Zm10 9v14h7.2c5.2 0 8.1-2.4 8.1-7s-2.9-7-8.1-7H29Z"/>

  <!-- Parking-bay cut lines make the P specific to Park.in. -->
  <path d="M22.9 18v25M22.9 43l-3.5 4.6M22.9 43l3.5 4.6" fill="none" stroke="#FED7AA" stroke-width="1.7" stroke-linecap="round" opacity=".82"/>

  <!-- Live availability beacon. -->
  <circle cx="43.5" cy="20.5" r="4.4" fill="#22D3EE" stroke="#CFFAFE" stroke-width="1.5"/>
  <circle cx="43.5" cy="20.5" r="1.5" fill="#07101F"/>
</svg>
